ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        # Request size limit: 2 MB
        maxRequestSize = 2097152
    }
    application {
        modules = [ com.mnebot.riptide.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "riptide-backend"
    audience = "riptide-app"
    realm = "Riptide"
    expirationSeconds = 86400
    refreshExpirationSeconds = 2592000
}

database {
    url = "jdbc:postgresql://localhost:5432/riptide?sslmode=prefer"
    url = ${?DATABASE_URL}
    user = "riptide"
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

google {
    clientId = ${GOOGLE_CLIENT_ID}
}

cors {
    # Comma-separated list of allowed hosts. Empty = anyHost (dev only).
    # Example: "riptide-backend.up.railway.app,api.riptide.app"
    allowedHosts = ""
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}
